
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doctor Dashboard</title>
  <link rel="stylesheet" href="doctor.css">
</head>
<body>
  <div class="container dashboard" id="doctorDashboard">
    <h1>Doctor Dashboard</h1>
    <p>Welcome, Dr. <span id="doctorName"></span></p>

    <div class="card">
      <h3>Doctor Profile</h3>
      <p>Doctor ID: <span id="doctorId"></span></p>
      <p>Name: <span id="doctorName"></span></p>
      <p>Email: <span id="doctorEmail"></span></p>
      <p>Phone: <span id="doctorPhone"></span></p>
      <p>Specialization: <span id="doctorSpecialization"></span></p>
      <p>Qualification: <span id="doctorQualification"></span></p>
    </div>

    <div class="card">
      <h3>Appointments</h3>
      <p>Appointment section can be connected to your existing database next.</p>
    </div>

    <button onclick="doctorLogout()">Logout</button>
  </div>

  <script src="doctor.js"></script>
</body>
</html>
